app = "medicoded-dashboard"
primary_region = "syd"

[build]

[env]
  PORT = "8501"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[processes]
  app = "streamlit run live_dashboard.py --server.port 8501 --server.address 0.0.0.0"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

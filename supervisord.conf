[supervisord]
nodaemon=true

[program:websocket]
command=python -c "from backend.websocket_server import run_server; run_server()"
directory=/app
autostart=true
autorestart=true
priority=10

[program:mobile]
command=python -m http.server 8000
directory=/app/mobile
autostart=true
autorestart=true
priority=20

[program:dashboard]
command=streamlit run live_dashboard.py --server.port=8501 --server.address=0.0.0.0
directory=/app
autostart=true
autorestart=true
priority=30
